name: CellScript CI

on:
  push:
    branches: [main, phase-2-implementation]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Build compiler
        run: make clean all
      - name: Run regression and Phase 2 tests
        run: make test
